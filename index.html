<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KLineChart + скринер + ликвидации</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        #top { display: flex; flex: 1; min-height: 0; }
        #chart-container { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0b0e11; }
        #toolbar { display: flex; gap: 6px; padding: 8px 12px; background: #1a1d23; border-bottom: 1px solid #2b2f36; align-items: center; flex-wrap: wrap; }
        button { background: transparent; border: 1px solid #2b2f36; color: #aeb3bb; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
        button:hover { border-color: #5e6673; color: #eaecef; }
        .interval-btn.active { background: #2b3139; color: #f0b90b; border-color: #f0b90b; }
        #chart { flex: 1; min-height: 0; width: 100%; }
        #screener { width: 230px; background: #1a1d23; border-left: 1px solid #2b2f36; overflow-y: auto; padding: 6px 4px; }
        #screener-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        #screener-table th { text-align: right; padding: 6px; color: #848e9c; font-size: 10px; border-bottom: 1px solid #2b2f36; background: #1a1d23; top: 0; position: sticky; }
        #screener-table th:first-child { text-align: left; }
        #screener-table td { padding: 5px 6px; text-align: right; }
        #screener-table td:first-child { text-align: left; font-weight: 600; }
        #screener-table tbody tr { cursor: pointer; transition: background 0.1s; }
        #screener-table tbody tr:hover { background: #252a30; }
        #screener-table tbody tr.active { background: #2b3b4a; border-left: 2px solid #f0b90b; }
        .price { font-variant-numeric: tabular-nums; }
        .change.positive { color: #0ecb81; }
        .change.negative { color: #f6465d; }
        .change.neutral { color: #848e9c; }
        #log-panel {
            height: 150px;
            background: #0f1217;
            border-top: 1px solid #2b2f36;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            color: #aeb3bb;
        }
        #log-panel div { margin-bottom: 2px; }
        .log-info { color: #aeb3bb; }
        .log-buy { color: #0ecb81; }
        .log-sell { color: #f6465d; }
        .log-warn { color: #f0b90b; }
        .log-error { color: #f6465d; }
    </style>
</head>
<body>
<div id="app">
    <div id="top">
        <div id="chart-container">
            <div id="toolbar">
                <button class="interval-btn active" data-interval="1m">1m</button>
                <button class="interval-btn" data-interval="5m">5m</button>
                <button class="interval-btn" data-interval="15m">15m</button>
                <button class="interval-btn" data-interval="1h">1h</button>
                <button class="interval-btn" data-interval="4h">4h</button>
                <button class="interval-btn" data-interval="1d">1d</button>
            </div>
            <div id="chart"></div>
        </div>
        <div id="screener">
            <table id="screener-table">
                <thead><tr><th>Пара</th><th>Цена</th><th>24ч %</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <div id="log-panel"></div>
</div>

<!-- Библиотека KLineChart -->
<script src="https://cdn.jsdelivr.net/npm/klinecharts/dist/klinecharts.min.js"></script>
<!-- Логика приложения -->
<script src="script.js"></script>
</body>
</html>
